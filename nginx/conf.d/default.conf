# Only send "Connection: upgrade" on real WebSocket handshakes
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name imm.local;

    # Telemetry ingest service: history/alerts/commands REST + realtime WebSocket
    # (used by the OpenMCT plugins). Strip the /api prefix before proxying.
    location ~ ^/api/(history|alerts|commands|realtime)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://telemetry-ingest:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Core backend (main:app) — its routes already carry the /api prefix
    # (/api/telemetry/*, /api/docs), so the URI is passed through unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /time/ {
        proxy_pass http://time-service:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /eclss/ {
        proxy_pass http://eclss-api:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /eva/ {
        proxy_pass http://eva-api:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /comms/ {
        proxy_pass http://comms-api:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500M;
    }

    location /schedule/ {
        proxy_pass http://scheduling-api:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /medical/ {
        proxy_pass http://medical-api:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /inventory/ {
        proxy_pass http://inventory-api:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 12m;   # incident photos (API limit 10 MB)
    }

    location /psych/ {
        proxy_pass http://psych-api:8008/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /astra/ {
        proxy_pass http://mission-assistant:8009/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openmct/ {
        proxy_pass http://openmct:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
