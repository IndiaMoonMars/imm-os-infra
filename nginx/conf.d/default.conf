# Only send "Connection: upgrade" on real WebSocket handshakes
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name imm.local;

    # Look services up through Docker's DNS on each request (cached 10 s) instead of
    # once at startup. A container recreated by `docker compose up -d --build` can
    # get a new IP; with a fixed proxy_pass host, nginx kept sending to the old one
    # until it was restarted. A variable in proxy_pass is what makes nginx resolve at
    # request time, so prefixes are stripped with rewrite instead of a proxy_pass URI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Telemetry ingest service: history/alerts/commands REST + realtime WebSocket
    # (used by the OpenMCT plugins). Strip the /api prefix before proxying.
    location ~ ^/api/(history|alerts|commands|realtime)(/|$) {
        set $up_ingest telemetry-ingest:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$up_ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Core backend (main:app) — its routes already carry the /api prefix
    # (/api/telemetry/*, /api/docs), so the URI is passed through unchanged.
    location /api/ {
        set $up_backend backend:8000;
        proxy_pass http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /time/ {
        set $up_time time-service:8002;
        rewrite ^/time/(.*)$ /$1 break;
        proxy_pass http://$up_time;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /eclss/ {
        set $up_eclss eclss-api:8003;
        rewrite ^/eclss/(.*)$ /$1 break;
        proxy_pass http://$up_eclss;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /eva/ {
        set $up_eva eva-api:8004;
        rewrite ^/eva/(.*)$ /$1 break;
        proxy_pass http://$up_eva;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /comms/ {
        set $up_comms comms-api:8005;
        rewrite ^/comms/(.*)$ /$1 break;
        proxy_pass http://$up_comms;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500M;
    }

    location /schedule/ {
        set $up_schedule scheduling-api:8006;
        rewrite ^/schedule/(.*)$ /$1 break;
        proxy_pass http://$up_schedule;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /medical/ {
        set $up_medical medical-api:8007;
        rewrite ^/medical/(.*)$ /$1 break;
        proxy_pass http://$up_medical;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /inventory/ {
        set $up_inventory inventory-api:8010;
        rewrite ^/inventory/(.*)$ /$1 break;
        proxy_pass http://$up_inventory;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 12m;   # incident photos (API limit 10 MB)
    }

    location /psych/ {
        set $up_psych psych-api:8008;
        rewrite ^/psych/(.*)$ /$1 break;
        proxy_pass http://$up_psych;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /astra/ {
        set $up_astra mission-assistant:8009;
        rewrite ^/astra/(.*)$ /$1 break;
        proxy_pass http://$up_astra;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openmct/ {
        set $up_openmct openmct:8080;
        rewrite ^/openmct/(.*)$ /$1 break;
        proxy_pass http://$up_openmct;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        set $up_keycloak keycloak:8080;
        proxy_pass http://$up_keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        set $up_frontend frontend:3000;
        proxy_pass http://$up_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
