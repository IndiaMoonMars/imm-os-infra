# Mosquitto MQTT broker configuration — IMM-OS
#
# Authenticated: every client needs a username/password (see entrypoint.sh,
# which builds the hashed password file from env vars on each start) and is
# limited to its topics by the ACL file. Auth and ACL apply to both listeners.

# Internal: services on the docker network only (not published to the host)
listener 1883

# LAN: TLS for edge nodes. Certificates from mosquitto/gen-certs.sh, copied
# into the data volume by entrypoint.sh so the mosquitto user can read the key.
listener 8883
cafile /mosquitto/data/certs/ca.crt
certfile /mosquitto/data/certs/server.crt
keyfile /mosquitto/data/certs/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Persistence — survives container restarts
persistence true
persistence_location /mosquitto/data/

# Logging to stdout → docker compose logs mosquitto
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Allow payloads up to 10 KB
message_size_limit 10240
